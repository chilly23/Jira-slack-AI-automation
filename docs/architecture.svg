<path d="M 560 376 H 656" fill="none" stroke="#bf4520" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="448" y="408" font-family="Geist Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#bf4520">context</text>
<path d="M 560 404 H 656" fill="none" stroke="#bf4520" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
</g>
