<text x="856" y="256" font-family="Geist, Arial, sans-serif" font-size="16" font-weight="600" fill="#2d3142">Jira issues</text>
<text x="856" y="280" font-family="Geist Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#4f5d75">Summary + description</text>
<rect x="864" y="300" width="288" height="52" rx="4" fill="#f5f5f5" stroke="#4f5d75" />
<path d="M 880 328 H 1128" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
</g>
<g data-node="Slack summary">
<rect x="832" y="436" width="352" height="144" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.5"/>
<text x="856" y="468" font-family="Geist, Arial, sans-serif" font-size="16" font-weight="600" fill="#2d3142">Slack summary</text>
<text x="856" y="492" font-family="Geist Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#4f5d75">Ticket links / names / dates</text>
<rect x="864" y="512" width="288" height="52" rx="4" fill="#f5f5f5" stroke="#4f5d75" />
<path d="M 880 540 H 1128" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
</g>
<text x="48" y="652" font-family="Geist, Arial, sans-serif" font-size="16" font-weight="400" fill="#2d3142">Extracted fields: title, assignee, due date and context. Jira receives summary and description.</text>
<path d="M 48 676 H 1232" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="48" y="700" font-family="Geist, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d75">Assignee and due date appear as Slack text • no human review or rollback step</text>
</svg>
