<text x="424" y="256" font-family="Geist, Arial, sans-serif" font-size="16" font-weight="600" fill="#2d3142">Extract + review</text>
<text x="424" y="280" font-family="Geist Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#4f5d75">Python / OpenRouter</text>
