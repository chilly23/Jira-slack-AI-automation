<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
<title id="architecture-title">Meeting notes become action items.</title>
<desc id="architecture-desc">Two requests to the same model precede ticket creation and a channel summary.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { color: #2d3142; font-family: Geist,Arial,sans-serif; }
      #architecture-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#architecture-root .diagram-container { overflow:visible }
}</style><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/></marker><pattern id="architecture-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="0.7" fill="#bfc0c0" opacity="0.45"/></pattern></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#f5f5f5" stroke="#f5f5f5" />
<rect x="24" y="180" width="1232" height="440" rx="0" fill="url(#architecture-dots)" stroke="none" />
<text x="48" y="40" font-family="Geist Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#4f5d75">AUTOMATION / JIRA + SLACK</text>
<text x="48" y="100" font-family="Instrument Serif, Georgia, serif" font-size="40" font-weight="400" fill="#2d3142">Meeting notes become action items.</text>
<text x="48" y="140" font-family="Geist, Arial, sans-serif" font-size="16" font-weight="400" fill="#4f5d75">Two requests to the same model precede ticket creation and a channel summary.</text>
<path d="M 48 168 H 1232" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 312 344 H 400" fill="none" stroke="#4f5d75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#architecture-arrow)"/>
<path d="M 704 296 H 832" fill="none" stroke="#4f5d75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#architecture-arrow)"/>
<path d="M 1008 368 V 436" fill="none" stroke="#4f5d75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#architecture-arrow)"/>
